name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # No incremental artifacts on a cold runner: they only slow the build and
  # bloat the cache.
  CARGO_INCREMENTAL: 0
  # Nothing debugs CI binaries; skip debug info entirely.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # No separate `cargo check`: `cargo test` and the release build below
      # already type-check every target.
      - name: Test
        run: cargo test

      - name: Build release (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin
